[project]
name = "memorai-backend"
version = "0.1.0"
description = "Memorai backend — typed memory engine for chat apps, FastAPI + msgspec + Tortoise ORM"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Memorai contributors" }]
dependencies = [
    # HTTP layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    # Validation / serialization (no pydantic in our code)
    "msgspec>=0.20.0",
    # OpenAI-SDK-compatible provider (chat + embeddings)
    "openai>=2.14.0",
    # Embedded graph DB
    "kuzu>=0.11.3",
    # Async ORM + migrations
    "tortoise-orm[sqlite]>=0.20.0",
    "aerich>=0.7.0",
    # Auth
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.2.0",
    # Misc
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]

# Application project — not packaged as a library.
[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["app", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.aerich]
tortoise_orm = "app.infrastructure.database.tortoise_config.TORTOISE_ORM"
src_folder = "."
