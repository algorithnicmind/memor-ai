[project]
name = "memorai-backend"
version = "0.1.0"
description = "Memorai backend — typed memory engine for chat apps, FastAPI + msgspec + Tortoise ORM"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Memorai contributors" }]
dependencies = [
    "aerich>=0.10.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "ladybug>=0.19.1",
    "msgspec>=0.21.1",
    "openai>=3.3.1",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "tortoise-orm>=1.1.8",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]

# Application project — not packaged as a library.
[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["app", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.aerich]
tortoise_orm = "app.infrastructure.database.tortoise_config.TORTOISE_ORM"
src_folder = "."
